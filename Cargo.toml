[package]
name = "deploy-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[[bin]]
name = "platform"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.7"
clap = { version = "4.5", features = ["derive"] }
minidock = { path = "../minidock" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "=0.3.47", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "migrate", "json"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
axum-extra = { version = "0.9", features = ["cookie"] }
cookie = "0.18"

[dev-dependencies]
assert_cmd = "2.0"
http-body-util = "0.1"
predicates = "3.1"
tempfile = "3.10"
tower = "0.5"
